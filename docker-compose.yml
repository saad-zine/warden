services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warden-backend
    environment:
      - WARDEN_DATA_DB=/data/warden.db
      - WARDEN_CHECKPOINT_DB=/data/checkpoints.db
    volumes:
      - warden-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: warden-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  warden-data:
